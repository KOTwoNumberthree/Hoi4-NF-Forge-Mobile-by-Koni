/* =========================================================================
   Touch gestures (Pointer Events unify touch/mouse/pen)
   - 1 finger on empty canvas, or a quick drag starting on a card: PAN
   - 2 fingers anywhere: PINCH-ZOOM (+ two-finger pan via centroid movement)
   - a clean tap on a card (no movement): SELECT (shows the contextual bar)
   - a clean tap on empty canvas: DESELECT
   - double-tap a card: jump straight into the edit sheet
   - double-tap empty canvas: create a new NF at that spot
   - LONG-PRESS a card (held still ~420ms) then drag: MOVE that NF, snapped
     live to whole grid units; releasing commits the (integer) position and
     recalculates every connection line in real time
   ========================================================================= */
const pointers = new Map();
let gestureMode = null; // null | 'pending-node' | 'pending-pan' | 'pan' | 'pinch' | 'moveNode'
let gctx = {};
let longPressTimer = null;
let lastTapInfo = null;      // { id, time } — for double-tap on a card
let lastEmptyTap = null;     // { time, x, y } — for double-tap on empty canvas
const LONG_PRESS_MS = 420, MOVE_THRESHOLD = 9, DOUBLE_TAP_MS = 320;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
function wrapRect(){ return document.getElementById("canvaswrap").getBoundingClientRect(); }

function setupGestures(){
  const wrap = document.getElementById("canvaswrap");
  wrap.addEventListener("pointerdown", onPointerDown);
  wrap.addEventListener("pointermove", onPointerMove);
  wrap.addEventListener("pointerup", onPointerUp);
  wrap.addEventListener("pointercancel", onPointerUp);
}
function onPointerDown(ev){
  try{ ev.target.setPointerCapture && ev.target.setPointerCapture(ev.pointerId); }catch(e){}
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });

  if(pointers.size === 1){
    const nodeEl = ev.target.closest && ev.target.closest(".mnode");
    gctx = {
      startX: ev.clientX, startY: ev.clientY, startTime: Date.now(),
      startCamX: state.camera.x, startCamY: state.camera.y,
      moved: false, nodeId: nodeEl ? nodeEl.getAttribute("data-id") : null,
    };
    if(nodeEl){
      gestureMode = "pending-node";
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(()=> beginNodeMove(gctx.nodeId), LONG_PRESS_MS);
    } else {
      gestureMode = "pending-pan";
    }
  } else if(pointers.size === 2){
    clearTimeout(longPressTimer);
    if(gestureMode === "moveNode") finishNodeMove();
    gestureMode = "pinch";
    const pts = [...pointers.values()];
    gctx.pinchStartDist = Math.max(dist(pts[0], pts[1]), 1);
    gctx.pinchStartZoom = state.camera.zoom;
    gctx.pinchCenterStart = mid(pts[0], pts[1]);
    gctx.pinchCamStart = { x: state.camera.x, y: state.camera.y };
  }
}
function onPointerMove(ev){
  if(!pointers.has(ev.pointerId)) return;
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });

  if(gestureMode === "pinch" && pointers.size >= 2){
    const pts = [...pointers.values()].slice(0,2);
    const d = Math.max(dist(pts[0], pts[1]), 1);
    const c = mid(pts[0], pts[1]);
    const rect = wrapRect();
    const worldAtStart = {
      x: (gctx.pinchCenterStart.x - rect.left - gctx.pinchCamStart.x) / gctx.pinchStartZoom,
      y: (gctx.pinchCenterStart.y - rect.top - gctx.pinchCamStart.y) / gctx.pinchStartZoom,
    };
    state.camera.zoom = clamp(gctx.pinchStartZoom * (d / gctx.pinchStartDist), 0.12, 2.2);
    state.camera.x = (c.x - rect.left) - worldAtStart.x * state.camera.zoom;
    state.camera.y = (c.y - rect.top) - worldAtStart.y * state.camera.zoom;
    renderCanvasTransform();
    return;
  }
  if(gestureMode === "moveNode"){
    const f = focusById(gctx.nodeId); if(!f) return;
    const dx = (ev.clientX - gctx.moveStartClientX) / state.camera.zoom;
    const dy = (ev.clientY - gctx.moveStartClientY) / state.camera.zoom;
    // Live-snapped to whole grid units on every frame — the stored value is
    // always an integer, never just the on-screen position.
    f.x = Math.round(gctx.moveStartFX + dx / M_GX);
    f.y = Math.round(gctx.moveStartFY + dy / M_GY);
    const nodeEl = document.querySelector(`.mnode[data-id="${cssEscape(f.id)}"]`);
    const tree = ft(); const pos = resolveAbsolutePositions(tree);
    if(nodeEl){ nodeEl.style.left = (pos[f.id].x*M_GX)+"px"; nodeEl.style.top = (pos[f.id].y*M_GY)+"px"; }
    renderConnectionsMobile(visibleFocuses(), pos);
    return;
  }
  if(gestureMode === "pending-node" || gestureMode === "pending-pan" || gestureMode === "pan"){
    const dx = ev.clientX - gctx.startX, dy = ev.clientY - gctx.startY;
    if(!gctx.moved && Math.hypot(dx,dy) > MOVE_THRESHOLD){
      gctx.moved = true;
      clearTimeout(longPressTimer);
      gestureMode = "pan"; // any real drag — even one starting on a card — pans, so panning never fights with tap/long-press
    }
    if(gestureMode === "pan"){
      state.camera.x = gctx.startCamX + dx;
      state.camera.y = gctx.startCamY + dy;
      renderCanvasTransform();
    }
  }
}
function onPointerUp(ev){
  clearTimeout(longPressTimer);
  const mode = gestureMode;
  pointers.delete(ev.pointerId);

  if(mode === "moveNode"){
    finishNodeMove();
  } else if(mode === "pending-node" && !gctx.moved){
    handleNodeTap(gctx.nodeId);
  } else if(mode === "pending-pan" && !gctx.moved){
    handleEmptyTap();
  }

  if(pointers.size === 0){
    gestureMode = null; gctx = {};
  } else if(pointers.size === 1){
    const remaining = [...pointers.values()][0];
    gctx = { startX: remaining.x, startY: remaining.y, startCamX: state.camera.x, startCamY: state.camera.y, moved:false, nodeId:null };
    gestureMode = "pending-pan"; // re-baseline so the last finger doesn't jump the camera
  }
}
function beginNodeMove(id){
  if(gestureMode !== "pending-node") return;
  if(state.ui.previewMode) return; // preview mode: press-and-hold pans the view instead of moving the NF
  const f = focusById(id); if(!f) return;
  gestureMode = "moveNode";
  gctx.nodeId = id;
  gctx.moveStartClientX = gctx.startX;
  gctx.moveStartClientY = gctx.startY;
  gctx.moveStartFX = f.x; gctx.moveStartFY = f.y;
  pushHistory(); // snapshot BEFORE any coordinate change, so Undo restores the pre-move position
  const nodeEl = document.querySelector(`.mnode[data-id="${cssEscape(id)}"]`);
  if(nodeEl) nodeEl.classList.add("moving");
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function finishNodeMove(){
  const nodeEl = document.querySelector(`.mnode[data-id="${cssEscape(gctx.nodeId)}"]`);
  if(nodeEl) nodeEl.classList.remove("moving");
  onProjectChanged();
  gestureMode = null;
}
function handleNodeTap(id){
  const now = Date.now();
  const isDoubleTap = lastTapInfo && lastTapInfo.id === id && (now - lastTapInfo.time) < DOUBLE_TAP_MS;
  lastTapInfo = { id, time: now };
  if(isDoubleTap){ openEditSheet(id); return; }
  state.selection = new Set([id]);
  state.activeFocusId = id;
  renderCanvasNodesSelectionOnly();
  renderCtxbar();
}
function handleEmptyTap(){
  const now = Date.now();
  const isDoubleTap = lastEmptyTap && (now - lastEmptyTap.time) < DOUBLE_TAP_MS && dist(lastEmptyTap, {x:gctx.startX,y:gctx.startY}) < 24;
  lastEmptyTap = { time: now, x: gctx.startX, y: gctx.startY };
  if(isDoubleTap){
    const rect = wrapRect();
    const world = screenToWorld(gctx.startX-rect.left, gctx.startY-rect.top);
    openEditSheet(null, { x: Math.round(world.x/M_GX), y: Math.round(world.y/M_GY) });
    return;
  }
  if(state.selection.size){ state.selection = new Set(); state.activeFocusId = null; renderCanvasNodesSelectionOnly(); renderCtxbar(); }
}
function setupFab(){
  document.getElementById("fab").addEventListener("click", ()=>{
    const wrap = document.getElementById("canvaswrap");
    const world = screenToWorld(wrap.clientWidth/2, wrap.clientHeight/2);
    openEditSheet(null, { x: Math.round(world.x/M_GX), y: Math.round(world.y/M_GY) });
  });
}

/* =========================================================================
   Generic picker sheet — reused for prerequisite selection, mutex selection
   and icon selection (grid mode). One component, several call sites.
   ========================================================================= */
function openPickerSheet(opts){
  const root = document.getElementById("pickerSheet");
  clear(root);
  root.appendChild(el("div",{class:"sheet-handle"}));
  const header = el("div",{class:"sheet-header"});
  header.appendChild(el("button",{class:"icon-btn", onclick:()=>closeSheet("pickerSheet")}, "✕"));
  header.appendChild(el("h3",null, opts.title));
  root.appendChild(header);
  const body = el("div",{class:"sheet-body"});

  if(opts.mode === "iconGrid"){
    const grid = el("div",{class:"asset-grid"});
    if(!opts.options.length) body.appendChild(el("p",{class:"m-note"}, "選択できるアイコンがありません。"));
    for(const o of opts.options){
      const tile = el("div",{class:"asset-tile"+(opts.selected===o.id?" sel":"")});
      if(o.dataUrl) tile.appendChild(el("img",{src:o.dataUrl}));
      else tile.appendChild(el("div",{style:"height:34px;display:flex;align-items:center;justify-content:center;"}, el("span",{style:"font-size:9px;color:var(--ink-faint);"},"GFX")));
      tile.appendChild(el("div",{class:"an"}, o.label));
      tile.onclick = ()=>{ closeSheet("pickerSheet"); opts.onConfirm(o.id); };
      grid.appendChild(tile);
    }
    body.appendChild(grid);
    root.appendChild(body);
    openSheet("pickerSheet");
    return;
  }

  // multi-select list mode (prerequisites / mutual exclusivity)
  const chosen = new Set(opts.selected || []);
  const saveBtn = el("button",{class:"save-btn", onclick:()=>{ closeSheet("pickerSheet"); opts.onConfirm([...chosen]); }}, "適用");
  header.appendChild(saveBtn);
  if(!opts.options.length) body.appendChild(el("p",{class:"m-note"}, "選択できるNFがありません。"));
  for(const o of opts.options){
    const row = el("div",{class:"m-list-row"});
    const chk = el("span",{style:"width:24px;font-size:17px;color:var(--brass-bright);flex:0 0 auto;"}, chosen.has(o.id)?"●":"○");
    row.appendChild(chk);
    row.appendChild(el("div",{style:"flex:1;min-width:0;"},[
      el("div",{style:"font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"}, o.label),
      el("div",{style:"font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);"}, o.id),
    ]));
    row.onclick = ()=>{
      if(chosen.has(o.id)){ chosen.delete(o.id); chk.textContent="○"; } else { chosen.add(o.id); chk.textContent="●"; }
    };
    body.appendChild(row);
  }
  root.appendChild(body);
  openSheet("pickerSheet");
}
function focusPickerOptions(excludeId){
  return ft().focuses.filter(o=>o.id!==excludeId).map(o=>({
    id:o.id,
    label:((state.project.localisation.entries[o.id]||{})[state.ui.codeLang]||{}).name || o.id,
  }));
}
function iconPickerOptions(){
  return [
    ...BUILTIN_ICONS.map(gfx=>({id:gfx, label:gfx.replace(/^GFX_/,""), dataUrl:null})),
    ...state.project.assets.icons.map(a=>({id:a.gfxName, label:a.gfxName.replace(/^GFX_/,""), dataUrl:a.dataUrl})),
  ];
}
function openPrereqQuickPicker(id){
  const f = focusById(id); if(!f) return;
  openPickerSheet({
    title:"前提NFを選択（単一グループ）",
    mode:"list",
    options: focusPickerOptions(id),
    selected: f.prerequisites.flat(),
    onConfirm:(ids)=>{ commit("set prerequisites", ()=>{ f.prerequisites = ids.length ? [ids] : []; }); },
  });
}
function openMutexPicker(id){
  openPickerSheet({
    title:"相互排他NFを選択",
    mode:"list",
    options: focusPickerOptions(id),
    selected: mutexPartnersOf(id),
    onConfirm:(ids)=>{
      commit("set mutex", ()=>{
        const tree = ft();
        tree.mutexGroups = tree.mutexGroups.map(g=>({...g, focuses:g.focuses.filter(x=>x!==id)})).filter(g=>g.focuses.length>1);
        if(ids.length) tree.mutexGroups.push({ id:uid("mutex"), focuses:[id, ...ids] });
      });
    },
  });
}

/* =========================================================================
   Edit sheet — full-screen, sectioned NF editor. Edits a local draft and
   applies everything in one commit on Save, so "入力 → 確認 → 保存" always
   completes in a single, keyboard-safe step (the Save button lives in a
   sticky header, never under the on-screen keyboard).
   ========================================================================= */
let editDraft = null;
let editDraftSnapshot = null;
function openEditSheet(focusId, presetPos){
  let draft;
  if(focusId){
    const src = focusById(focusId);
    draft = {
      mode:"edit", originalId:focusId, id:src.id, icon:src.icon, branchId:src.branchId, cost:src.cost,
      x:src.x, y:src.y, prerequisites: deepClone(src.prerequisites), mutexPartners: mutexPartnersOf(focusId),
      availableCode:src.availableCode, bypassCode:src.bypassCode, cancelCode:src.cancelCode,
      completionRewardCode:src.completionRewardCode, aiWillDoCode:src.aiWillDoCode,
      willLeadToWarWithCode:src.willLeadToWarWithCode, searchFiltersCode:src.searchFiltersCode,
      loc:{},
    };
  } else {
    draft = {
      mode:"create", originalId:null, id: uniqueFocusId("NEW_FOCUS"), icon:"GFX_goal_generic_national_focus",
      branchId: state.ui.activeBranchFilter || (ft().branches[0] && ft().branches[0].id) || "",
      cost:10, x:(presetPos&&presetPos.x)||0, y:(presetPos&&presetPos.y)||0,
      prerequisites:[], mutexPartners:[],
      availableCode:"", bypassCode:"", cancelCode:"", completionRewardCode:"", aiWillDoCode:"",
      willLeadToWarWithCode:"", searchFiltersCode:"",
      loc:{},
    };
  }
  for(const lang of state.project.localisation.languages){
    const existing = focusId ? (state.project.localisation.entries[focusId]||{})[lang.code] : null;
    draft.loc[lang.code] = { name:(existing&&existing.name)||"", desc:(existing&&existing.desc)||"" };
  }
  editDraft = draft;
  editDraftSnapshot = JSON.stringify(draft);
  renderEditSheet();
  openSheet("editSheet");
}
function closeEditSheet(force){
  if(!force && editDraft && JSON.stringify(editDraft) !== editDraftSnapshot){
    if(!confirm("編集内容を保存せずに閉じますか？")) return;
  }
  editDraft = null;
  closeSheet("editSheet");
}
function renderEditSheet(){
  const root = document.getElementById("editSheet");
  clear(root);
  const d = editDraft;
  root.appendChild(el("div",{class:"sheet-handle"}));
  const header = el("div",{class:"sheet-header"});
  header.appendChild(el("button",{class:"icon-btn", onclick:()=>closeEditSheet(false)}, "✕"));
  header.appendChild(el("h3",null, d.mode==="create" ? "新規NF" : d.id));
  header.appendChild(el("button",{class:"save-btn", onclick:saveEditDraft}, "保存"));
  root.appendChild(header);

  const body = el("div",{class:"sheet-body"});

  // 基本情報
  const secBasic = el("div",{class:"m-section"});
  secBasic.appendChild(el("h4",null,"基本情報"));
  const idField = el("div",{class:"m-field"},[ el("label",null,"NF ID"),
    el("input",{type:"text", value:d.id, oninput:function(){ d.id = this.value; }}) ]);
  secBasic.appendChild(idField);
  const iconRow = el("div",{class:"m-field"},[ el("label",null,"アイコン") ]);
  const iconBtnEl = el("button",{class:"m-btn full", style:"justify-content:flex-start;gap:10px;", onclick:()=>{
    openPickerSheet({ title:"アイコンを選択", mode:"iconGrid", options: iconPickerOptions(), selected: d.icon,
      onConfirm:(gfx)=>{ d.icon = gfx; renderEditSheet(); } });
  }});
  const iconPrev = el("span",{style:"width:28px;height:28px;border-radius:6px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;"});
  const iconAsset = state.project.assets.icons.find(a=>a.gfxName===d.icon);
  if(iconAsset) iconPrev.appendChild(el("img",{src:iconAsset.dataUrl, style:"width:100%;height:100%;object-fit:contain;"}));
  else iconPrev.appendChild(el("span",{style:"font-size:9px;color:var(--ink-faint);"},"GFX"));
  iconBtnEl.appendChild(iconPrev);
  iconBtnEl.appendChild(el("span",{style:"font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;"}, d.icon||"(未選択)"));
  iconRow.appendChild(iconBtnEl);
  secBasic.appendChild(iconRow);

  const branchSel = el("select",{onchange:function(){ d.branchId = this.value; }});
  branchSel.appendChild(el("option",{value:""}, "(未分類)"));
  for(const b of ft().branches) branchSel.appendChild(el("option",{value:b.id, selected:d.branchId===b.id}, b.name));
  secBasic.appendChild(el("div",{class:"m-field"},[ el("label",null,"ブランチ"), branchSel ]));

  const costInput = el("input",{type:"number", inputmode:"decimal", value:d.cost});
  const daysNote = el("div",{class:"m-note"}, `≈ ${costToDays(d.cost)} 日（HOI4コスト × 7）`);
  costInput.addEventListener("input", function(){ d.cost = parseFloat(this.value)||0; daysNote.textContent = `≈ ${costToDays(d.cost)} 日（HOI4コスト × 7）`; });
  secBasic.appendChild(el("div",{class:"m-field"},[ el("label",null,"Cost（HOI4コスト値）"), costInput, daysNote ]));
  body.appendChild(secBasic);

  // 配置（整数座標）
  const secPos = el("div",{class:"m-section"});
  secPos.appendChild(el("h4",null,"配置（X・Yは常に整数）"));
  const xInput = el("input",{type:"number", step:"1", inputmode:"numeric", value:d.x, oninput:function(){ d.x = Math.round(parseFloat(this.value)||0); }});
  const yInput = el("input",{type:"number", step:"1", inputmode:"numeric", value:d.y, oninput:function(){ d.y = Math.round(parseFloat(this.value)||0); }});
  secPos.appendChild(el("div",{class:"m-row"},[
    el("div",{class:"m-field"},[ el("label",null,"X"), xInput ]),
    el("div",{class:"m-field"},[ el("label",null,"Y"), yInput ]),
  ]));
  body.appendChild(secPos);

  // 前提条件
  const secPre = el("div",{class:"m-section"});
  secPre.appendChild(el("h4",null,"前提条件（各グループはOR、グループ内はAND）"));
  d.prerequisites.forEach((group, gi)=>{
    const gWrap = el("div",{style:"background:var(--bg-alt);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;"});
    gWrap.appendChild(el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"},[
      el("span",{style:"font-size:10.5px;color:var(--ink-faint);"}, `グループ ${gi+1}${d.prerequisites.length>1?"（OR）":""}`),
      el("button",{class:"m-btn", style:"height:32px;padding:0 10px;font-size:11px;", onclick:()=>{ d.prerequisites.splice(gi,1); renderEditSheet(); }}, "グループ削除"),
    ]));
    const chipWrap = el("div",{class:"chip-wrap"});
    group.forEach((pid,pi)=> chipWrap.appendChild(el("span",{class:"m-chip"}, [ pid,
      el("span",{class:"x", onclick:()=>{ group.splice(pi,1); if(!group.length) d.prerequisites.splice(gi,1); renderEditSheet(); }}, "×") ])));
    gWrap.appendChild(chipWrap);
    gWrap.appendChild(el("button",{class:"m-btn full", style:"margin-top:4px;", onclick:()=>{
      openPickerSheet({ title:`グループ ${gi+1} に追加`, mode:"list", options: focusPickerOptions(d.originalId||"__new__"), selected: group,
        onConfirm:(ids)=>{ d.prerequisites[gi] = ids; if(!ids.length) d.prerequisites.splice(gi,1); renderEditSheet(); } });
    }}, "＋ NFを選択"));
    secPre.appendChild(gWrap);
  });
  secPre.appendChild(el("button",{class:"m-btn full", onclick:()=>{ d.prerequisites.push([]); renderEditSheet(); }}, "＋ ORグループを追加"));
  body.appendChild(secPre);

  // 排他条件
  const secMx = el("div",{class:"m-section"});
  secMx.appendChild(el("h4",null,"相互排他"));
  const mxChips = el("div",{class:"chip-wrap"});
  d.mutexPartners.forEach((pid,pi)=> mxChips.appendChild(el("span",{class:"m-chip mx"}, [ pid,
    el("span",{class:"x", onclick:()=>{ d.mutexPartners.splice(pi,1); renderEditSheet(); }}, "×") ])));
  secMx.appendChild(mxChips);
  secMx.appendChild(el("button",{class:"m-btn full", onclick:()=>{
    openPickerSheet({ title:"相互排他NFを選択", mode:"list", options: focusPickerOptions(d.originalId||"__new__"), selected: d.mutexPartners,
      onConfirm:(ids)=>{ d.mutexPartners = ids; renderEditSheet(); } });
  }}, "＋ 相互排他NFを選択"));
  body.appendChild(secMx);

  // Localisation
  const secLoc = el("div",{class:"m-section"});
  secLoc.appendChild(el("h4",null,"Localisation"));
  for(const lang of state.project.localisation.languages){
    const entry = d.loc[lang.code] || (d.loc[lang.code] = {name:"",desc:""});
    const wrap = el("div",{style:"border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;"});
    wrap.appendChild(el("div",{style:"font-family:var(--font-head);font-size:12px;color:var(--brass-bright);margin-bottom:6px;"}, lang.label));
    wrap.appendChild(el("div",{class:"m-field"},[ el("label",null,"表示名"), el("input",{type:"text", value:entry.name, oninput:function(){ entry.name=this.value; }}) ]));
    wrap.appendChild(el("div",{class:"m-field"},[ el("label",null,"説明"), el("textarea",{oninput:function(){ entry.desc=this.value; }}, entry.desc) ]));
    secLoc.appendChild(wrap);
  }
  body.appendChild(secLoc);

  // 詳細設定（自由記述コード）
  const secCode = el("div",{class:"m-section"});
  secCode.appendChild(el("h4",null,"詳細設定（Effect / Trigger 自由記述）"));
  secCode.appendChild(codeField("completion_reward","completionRewardCode",d));
  secCode.appendChild(codeField("available","availableCode",d));
  secCode.appendChild(codeField("bypass","bypassCode",d));
  secCode.appendChild(codeField("cancel","cancelCode",d));
  secCode.appendChild(codeField("ai_will_do","aiWillDoCode",d));
  secCode.appendChild(codeField("will_lead_to_war_with（タグを空白区切り）","willLeadToWarWithCode",d));
  secCode.appendChild(codeField("search_filters","searchFiltersCode",d));
  body.appendChild(secCode);

  // ステータス（既存データのバリデーション結果）
  if(d.mode === "edit"){
    const secStatus = el("div",{class:"m-section"});
    secStatus.appendChild(el("h4",null,"ステータス"));
    const issues = focusIssues(mobileIssues, d.originalId);
    if(!issues.length) secStatus.appendChild(el("div",{class:"status-item ok"}, "問題は検出されていません"));
    for(const i of issues) secStatus.appendChild(el("div",{class:"status-item "+i.severity}, i.message));
    body.appendChild(secStatus);
  }

  // 削除
  if(d.mode === "edit"){
    body.appendChild(el("button",{class:"m-btn danger full", style:"margin-top:8px;", onclick:()=>{
      const id = d.originalId;
      closeEditSheet(true);
      mobileDelete(id);
    }}, "🗑 このNFを削除"));
  }
  root.appendChild(body);
}
function codeField(label, key, d){
  return el("div",{class:"m-field"},[ el("label",null,label), el("textarea",{oninput:function(){ d[key]=this.value; }}, d[key]) ]);
}
function saveEditDraft(){
  const d = editDraft; if(!d) return;
  const newId = toSafeId(d.id);
  if(d.mode === "edit" && newId !== d.originalId && focusById(newId)){
    alert("そのIDは既に使用されています。別のIDを指定してください。");
    return;
  }
  let finalId = newId;
  commit("save focus", ()=>{
    const tree = ft();
    if(d.mode === "create"){
      finalId = focusById(newId) ? uniqueFocusId(newId) : newId;
      const f = makeFocus({
        id:finalId, icon:d.icon, x:Math.round(d.x), y:Math.round(d.y), cost:parseFloat(d.cost)||0, branchId:d.branchId,
        prerequisites:d.prerequisites.filter(g=>g.length),
        availableCode:d.availableCode, bypassCode:d.bypassCode, cancelCode:d.cancelCode,
        completionRewardCode:d.completionRewardCode, aiWillDoCode:d.aiWillDoCode,
        willLeadToWarWithCode:d.willLeadToWarWithCode, searchFiltersCode:d.searchFiltersCode,
      });
      tree.focuses.push(f);
    } else {
      if(newId !== d.originalId){
        const renamed = renameFocusId(d.originalId, newId);
        finalId = renamed || d.originalId; // pre-checked above, so renamed should not be null
      } else {
        finalId = d.originalId;
      }
      const f = focusById(finalId);
      f.icon=d.icon; f.branchId=d.branchId; f.cost=parseFloat(d.cost)||0;
      f.x=Math.round(d.x); f.y=Math.round(d.y);
      f.prerequisites = d.prerequisites.filter(g=>g.length);
      f.availableCode=d.availableCode; f.bypassCode=d.bypassCode; f.cancelCode=d.cancelCode;
      f.completionRewardCode=d.completionRewardCode; f.aiWillDoCode=d.aiWillDoCode;
      f.willLeadToWarWithCode=d.willLeadToWarWithCode; f.searchFiltersCode=d.searchFiltersCode;
    }
    tree.mutexGroups = tree.mutexGroups.map(g=>({...g, focuses:g.focuses.filter(x=>x!==finalId)})).filter(g=>g.focuses.length>1);
    if(d.mutexPartners.length) tree.mutexGroups.push({ id:uid("mutex"), focuses:[finalId, ...d.mutexPartners] });
    state.project.localisation.entries[finalId] = deepClone(d.loc);
    state.selection = new Set([finalId]);
    state.activeFocusId = finalId;
  });
  editDraft = null;
  closeSheet("editSheet");
}


/* -------- orthogonal (H/V-only) connector path builder (shared, geometry-agnostic) -------- */
// Builds a horizontal/vertical-only path: down from A to the vertical
// midpoint, across to B's column, then down into B. Falls back to a single
// straight segment when A and B already share a column or a row, so no
// pointless jog is drawn. Never produces a diagonal segment. Pure function —
// identical on desktop and mobile; only the anchor *coordinates* fed into it
// differ (because card pixel size differs), not the routing algorithm.
function orthogonalPath(ax, ay, bx, by){
  if(Math.abs(ax-bx) < 0.5 || Math.abs(ay-by) < 0.5) return `M ${ax} ${ay} L ${bx} ${by}`;
  const midY = (ay+by)/2;
  return `M ${ax} ${ay} L ${ax} ${midY} L ${bx} ${midY} L ${bx} ${by}`;
}

function focusOnNodeMobile(id){

function importYmlFilesMobile(files, reportBox, forceLangKey, onDone){
  let pending = files.length;
  const allStats = [];
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      let stats=null, error=null;
      try{
        const parsedByLang = parseLocalisationText(String(reader.result), forceLangKey||null);
        if(!Object.keys(parsedByLang).length){
          error = forceLangKey ? "有効な行が見つかりませんでした。" : "l_<言語>: ブロックが見つかりません。言語を手動指定してください。";
        } else {
          commit("import yml: "+file.name, ()=>{ stats = mergeLocalisationImport(parsedByLang); });
        }
      }catch(e){ error = e.message; }
      allStats.push({name:file.name, stats, error});
      pending--;
      if(pending===0){
        clear(reportBox);
        for(const s of allStats){
          const wrap = el("div",{class:"import-report"});
          wrap.appendChild(el("div",{class:"fn"}, s.name));
          if(s.error) wrap.appendChild(el("div",{style:"color:var(--red-bright);"}, "✕ "+s.error));
          else for(const lk in s.stats.languages){
            const ls = s.stats.languages[lk];
            wrap.appendChild(el("div",{style:"color:var(--ink-dim);"}, `${labelForLangKey(lk)}: ${ls.keys}キー中 一致${ls.matched} / 未対応${ls.unmatched}`));
          }
          reportBox.appendChild(wrap);
        }
        onDone();
      }
    };
    reader.readAsText(file, "utf-8");
  });
}

/* =========================================================================
   File I/O — JSON project save/load, HOI4 code import, export bundle.
   Uses the same downloads-capability wrapper pattern as the desktop build.
   ========================================================================= */
let downloadsNS = null;
async function initDownloads(){
  try{ downloadsNS = await claude.use("downloads"); }catch(e){ downloadsNS = null; }
}
async function offerDownload(filename, data){
  if(downloadsNS){
    try{ await downloadsNS.save({ filename, data }); return; }
    catch(err){ if(err && err.code==="declined") return; }
  }
  try{
    const blob = typeof data==="string" ? new Blob([data], {type:"text/plain;charset=utf-8"}) : data;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
  }catch(e){ alert("ダウンロードできませんでした: "+e.message); }
}
function saveProjectFile(){
  offerDownload((ft().id||"project")+".json", JSON.stringify(state.project, null, 2));

function openProjectFilePicker(){
  const input = el("input",{type:"file", accept:".json,application/json", style:"display:none", onchange:()=>{
    const file = input.files[0]; if(!file) return;

    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.focusTree) throw new Error("focusTree が見つかりません");
        pushHistory();
        state.project = Object.assign(makeEmptyProject(), parsed);
        sanitizeCoordinates(state.project.focusTree);
        state.selection = new Set(); state.activeFocusId = null;
        onProjectChanged();
        fitToScreen();
      }catch(err){ alert("読み込みに失敗しました: "+err.message); }

function openCodeImportPicker(){
  const input = el("input",{type:"file", accept:".txt,text/plain", style:"display:none", onchange:()=>{
    const file = input.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      const res = parseFocusTreeText(String(reader.result));
      if(!res.ok){ alert("インポートに失敗しました: "+res.error); return; }
      commit("import code", ()=>{
        const oldLoc = deepClone(state.project.localisation);
        state.project.focusTree = res.tree;
        const kept = {};
        for(const f of res.tree.focuses) if(oldLoc.entries[f.id]) kept[f.id] = oldLoc.entries[f.id];
        state.project.localisation.entries = kept;
        for(const f of res.tree.focuses) if(!state.project.localisation.entries[f.id]) state.project.localisation.entries[f.id] = {};
        state.selection = new Set(); state.activeFocusId = null;
      });
      if(res.warnings.length) alert(`インポート完了（警告 ${res.warnings.length} 件）\n` + res.warnings.slice(0,5).map(w=>`・${w.target}: ${w.reason}`).join("\n"));
      fitToScreen();
    };
    reader.readAsText(file, "utf-8");
  }});
  document.body.appendChild(input); input.click(); setTimeout(()=>input.remove(), 3000);
}
async function exportBundleMobile(){

  const zip = new JSZip();

  zip.file(`common/national_focus/${treeId}.txt`, "\uFEFF" + generateFocusTreeCode(state.project));

  zip.file(`${treeId}.project.json`, JSON.stringify(state.project, null, 2));

   filter / hidden branches, exactly like the on-screen preview) with a
   dedicated Canvas 2D renderer, so the exported image never depends on
   whatever happens to be scrolled into view on screen.
   ========================================================================= */
async function exportTreePng(){
  const tree = ft();
  const visible = visibleFocuses();
  if(!visible.length){ alert("書き出すNFがありません。"); return; }
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  const pos = resolveAbsolutePositions(tree);
  const NW = 152, NH = 92; // must match .mnode's on-screen size
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const f of visible){
    const p = pos[f.id];
    minX = Math.min(minX, p.x*M_GX); maxX = Math.max(maxX, p.x*M_GX+NW);
    minY = Math.min(minY, p.y*M_GY); maxY = Math.max(maxY, p.y*M_GY+NH);
  }
  const margin = 60;
  const w = Math.ceil(maxX-minX+margin*2), h = Math.ceil(maxY-minY+margin*2);
  const scale = 2; // render at 2x for a crisp image
  const canvas = document.createElement("canvas");
  canvas.width = w*scale; canvas.height = h*scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  const ox = margin-minX, oy = margin-minY; // offsets: grid space -> canvas space

  // background
  ctx.fillStyle = "#11151b";
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  for(let gx=0; gx<w; gx+=24){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,h); ctx.stroke(); }
  for(let gy=0; gy<h; gy+=24){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(w,gy); ctx.stroke(); }

  const visibleIds = new Set(visible.map(f=>f.id));
  // connections first (they render beneath the cards, same as on screen)
  function drawPath(d, color, dashed){
    const cmds = d.match(/[ML]\s*[-\d.]+\s+[-\d.]+/g) || [];
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.setLineDash(dashed ? [6,4] : []);
    ctx.beginPath();
    let first = true;
    for(const c of cmds){
      const m = c.match(/([ML])\s*([-\d.]+)\s+([-\d.]+)/);
      if(!m) continue;
      const x = parseFloat(m[2])+ox, y = parseFloat(m[3])+oy;
      if(first){ ctx.moveTo(x,y); first=false; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.restore();
  }
  for(const f of visible){
    if(!f.prerequisites.length) continue;
    f.prerequisites.forEach(group=>{
      group.forEach(fromId=>{
        if(!visibleIds.has(fromId)) return;
        const fp = pos[fromId]; if(!fp) return;
        const { ax, ay, bx, by } = mobileAnchors(fp, pos[f.id]);
        drawPath(orthogonalPath(ax,ay,bx,by), "#eef1f5", group.length>1);
      });
    });
  }
  const drawnPairs = new Set();
  for(const g of tree.mutexGroups){
    for(let i=0;i<g.focuses.length;i++) for(let j=i+1;j<g.focuses.length;j++){
      const a=g.focuses[i], b=g.focuses[j];
      if(!visibleIds.has(a)||!visibleIds.has(b)) continue;
      const key=[a,b].sort().join("|"); if(drawnPairs.has(key)) continue; drawnPairs.add(key);
      const { ax, ay, bx, by } = mobileAnchors(pos[a], pos[b]);
      drawPath(orthogonalPath(ax,ay,bx,by), "#e2694f", true);
    }
  }

  // preload custom icon images used by visible nodes
  const iconImgs = {};
  await Promise.all(visible.map(f=>{
    const asset = state.project.assets.icons.find(a=>a.gfxName===f.icon);
    if(!asset || iconImgs[f.icon]) return null;
    return new Promise(res=>{
      const img = new Image();
      img.onload = ()=>{ iconImgs[f.icon]=img; res(); };
      img.onerror = ()=> res();
      img.src = asset.dataUrl;
    });
  }));

  // cards on top of the connection lines
  for(const f of visible){
    const p = pos[f.id];
    const x = p.x*M_GX+ox, y = p.y*M_GY+oy;
    const branch = branchById(f.branchId);
    const locEntry = (state.project.localisation.entries[f.id]||{})[state.ui.codeLang] || (Object.values(state.project.localisation.entries[f.id]||{})[0]) || {};
    // card
    roundRect(ctx, x, y, NW, NH, 10);
    const grad = ctx.createLinearGradient(x,y,x,y+NH);
    grad.addColorStop(0, "#1f2733"); grad.addColorStop(1, "#1a212b");
    ctx.fillStyle = grad; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#2a3341"; ctx.stroke();
    // icon box
    roundRect(ctx, x+11, y+10, 30, 30, 6);
    ctx.fillStyle = "#161b22"; ctx.fill(); ctx.strokeStyle="#2a3341"; ctx.lineWidth=1; ctx.stroke();
    if(iconImgs[f.icon]) ctx.drawImage(iconImgs[f.icon], x+13, y+12, 26, 26);
    // branch dot
    if(branch){ ctx.fillStyle = branch.color; ctx.beginPath(); ctx.arc(x+NW-17, y+16, 4, 0, Math.PI*2); ctx.fill(); }
    // title
    ctx.fillStyle = "#d9dee6"; ctx.font = "600 13px Inter, sans-serif"; ctx.textBaseline="top";
    wrapText(ctx, locEntry.name || f.id, x+11, y+49, NW-22, 15, 2);
    // id
    ctx.fillStyle = "#5c6675"; ctx.font = "9px 'IBM Plex Mono', monospace";
    ctx.fillText(truncate(ctx, f.id, NW-22), x+11, y+77);
    // cost
    ctx.fillStyle = "#e6b95c"; ctx.font = "11px 'IBM Plex Mono', monospace";
    ctx.fillText("⏱ "+costToDays(f.cost)+"日", x+11, y+NH-19);
  }

  canvas.toBlob(blob=>{
    if(!blob){ alert("画像の生成に失敗しました。"); return; }
    offerDownload((tree.id||"focus_tree")+"_preview.png", blob);
  }, "image/png");
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function truncate(ctx, text, maxW){
  if(ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+"…").width > maxW) t = t.slice(0,-1);
  return t+"…";
}
function wrapText(ctx, text, x, y, maxW, lineH, maxLines){
  const words = String(text).split("");
  let line = "", lines = [];
  for(const ch of words){
    const test = line+ch;
    if(ctx.measureText(test).width > maxW && line){ lines.push(line); line = ch; if(lines.length===maxLines-1){} }
    else line = test;
    if(lines.length >= maxLines) break;
  }
  if(line && lines.length < maxLines) lines.push(line);
  if(lines.length === maxLines){
    let last = lines[maxLines-1];
    while(last.length>1 && ctx.measureText(last+"…").width > maxW) last = last.slice(0,-1);
    lines[maxLines-1] = last + (ctx.measureText(text).width>maxW?"…":"");
  }
  lines.forEach((l,i)=> ctx.fillText(l, x, y+i*lineH));
}

/* =========================================================================
   Autosave + init
   ========================================================================= */
const AUTOSAVE_KEY = "focusforge_mobile_autosave_v1";
const scheduleAutosave = debounce(()=>{
  try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ project: state.project, savedAt: Date.now() })); }catch(e){}
}, 900);
function tryLoadAutosave(){
  try{
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.project && parsed.project.focusTree) return parsed;
  }catch(e){}
  return null;
}
function init(){
  initDownloads();
  setupViewportUnit();
  const saved = tryLoadAutosave();
  state.project = saved ? Object.assign(makeEmptyProject(), saved.project) : seedProject();
  sanitizeCoordinates(state.project.focusTree);
  if(!state.project.localisation.languages.some(l=>l.code===state.ui.codeLang)){
    state.ui.codeLang = (state.project.localisation.languages[0]||{}).code || "japanese";
  }
  setupGestures();
  setupFab();
  document.getElementById("scrim").addEventListener("click", closeAllSheets);
  window.addEventListener("resize", ()=> renderCanvasTransform());
  renderAll();
  fitToScreen();
  state.ready = true;
}
document.addEventListener("DOMContentLoaded", init);

</script>
